name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Fail on golden divergence sample
        run: node --input-type=module -e "import { createCase, addJob, addSalary, runModality, compareTotals } from './packages/calculation-core/dist/index.js'; let c=createCase({nome:'CI'}); c=addJob(c,{employer:'A',start:'2000-01-01',end:'2010-01-01',factor:1}); c=addSalary(c,{competence:'2019-01',value:3000}); const r=runModality('rmi-lei-9876',c); const bad=compareTotals(r.totals,{rmi:Number(r.totals.rmi)+999},0.01); if(bad.ok) { console.error('tolerância deveria falhar'); process.exit(1);} console.log('divergência detectada ok');"
