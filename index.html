/* Navegação clássica: início no menu superior e faixa recolhível. */
.classic-menu{overflow-x:auto;overflow-y:hidden}
.classic-menu .menu-spacer{flex:1 0 8px;margin-left:0}
.classic-menu .ribbon-toggle{margin-left:auto;position:sticky;right:0;z-index:2;background:#2d3035;box-shadow:-10px 0 12px #2d3035;display:flex;align-items:center;gap:8px;font-weight:650;flex-shrink:0;border-left:1px solid #545961;padding:7px 12px}
.classic-menu .ribbon-toggle:hover{background:#45494f}
.classic-menu .toggle-chevron{font-size:21px;font-weight:700;line-height:12px;color:#ffa562}

/* Editor contextual: oculto no modo de visualização; aparece ao clicar em Editar. */
.classic-menu button.is-editing{background:#e9670a;color:white}
.editor-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:8px 13px;background:#fff8f2;border-bottom:2px solid var(--orange);flex-shrink:0;min-height:49px}
.editor-toolbar select{border:1px solid #cbd2d9;background:white;border-radius:6px;padding:7px 9px;font-size:12px;min-width:66px}
.editor-toolbar select.font-picker{min-width:130px}
.editor-toolbar .edit-divider{height:27px;width:1px;background:#d9cabe;margin:0 3px}
.editor-toolbar .text-tool{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:33px;padding:6px 10px;border:1px solid #d6dce1;border-radius:6px;background:#fff;color:#31363c;font-size:13px;font-weight:650}
.editor-toolbar .text-tool:hover:not(:disabled){border-color:#f69a54;background:#fff0e4}
.editor-toolbar .text-tool:disabled{opacity:.38;cursor:not-allowed;background:#f8f8f8}
.editor-toolbar .undo-tool{font-size:12px;gap:5px}
.editor-toolbar .undo-tool svg{width:16px;height:16px}
.editor-toolbar .reset-original{border-color:#ecc09e;color:#9b430d}
.editor-toolbar .tool-hint{max-width:250px}
.editor-toolbar .text-tool.strong{font-weight:800;font-size:16px}
.editor-toolbar .text-tool.emphasis{font-family:Georgia,serif;font-style:italic;font-size:17px}
.editor-toolbar .text-tool.underlined{text-decoration:underline;font-size:16px}
.editor-toolbar .tool-hint{font-size:11px;color:#8f654a;margin-left:auto;max-width:310px;line-height:1.3}
.doc-paper.editing{outline:2px dashed #f9ad70;outline-offset:6px;border-radius:3px;cursor:text;min-height:480px}
.doc-paper.editing:focus{outline:2px solid #ee760a}
.editor-toolbar .done{background:var(--orange);border-color:var(--orange);color:#fff}

/* Importação de CNIS: conferência antes da aplicação ao Histórico. */
.cnis-preview{width:min(1080px,96vw);max-height:94vh}
.cnis-preview .modal-body{padding:16px 22px}
.cnis-preview .modal-footer{flex-wrap:wrap;gap:8px}
.cnis-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 17px}
.cnis-summary>div{border:1px solid #e1e4e8;background:#f8fafb;border-radius:9px;padding:12px}
.cnis-summary strong{font-size:22px;color:#ed690d;display:block}
.cnis-summary span{font-size:12px;color:#666f78}
.cnis-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cnis-fields>div{border-bottom:1px solid #e5e8ec;padding:6px 0}
.cnis-fields span{display:block;font-size:11px;color:#707c86}
.cnis-fields strong{font-size:12px;color:#20242a;word-break:break-word}
.cnis-mini-scroll{max-height:240px;overflow:auto;border:1px solid #dce1e6;border-radius:7px}
.cnis-mini-scroll table{min-width:700px}.cnis-mini-scroll th,.cnis-mini-scroll td{font-size:11px;padding:7px 8px}
.cnis-small{font-size:11px;color:#667381}
.cnis-warnings{border:1px solid #f2ce9f;background:#fff9f0;color:#8a4b09;border-radius:8px;padding:13px 17px;font-size:12px;line-height:1.5}
.cnis-warnings ul{margin:6px 0 0;padding-left:20px}
.cnis-import-band{border:1px solid #ffd3b3;background:#fff9f3;border-radius:8px;padding:11px 13px;font-size:12px;color:#81481c;margin:12px 0}
.cnis-import-band strong{color:#9b4c0b}
@media(max-width:850px){.cnis-fields{grid-template-columns:1fr}.cnis-summary{gap:6px}}

'Apuração das Diferenças pelo sistema de atualização do Salário-de-benefício',
'Apuração das Diferenças (apenas salário mínimo)',
'Apuração das diferenças (art. 45 da Lei 8.213/91)',

};
function ic(name,cl=''){return `<svg class="${cl}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]||PATHS.file}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(val){if(!val)return '—';const s=String(val);if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);return esc(s)}
function nowTime(){return new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function makeId(){return 'tc-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function blank(){return {id:makeId(),title:'Novo cálculo',client:{nome:'',endereco:'',complemento:'',nascimento:'',mae:'',nit:'',beneficio:'',aps:'',rg:'',ctps:'',cpf:'',observacao:'',requerimento:''},salaries:[],jobs:[],extraJobs:[],modalities:[TYPES[0]],selected:0,createdAt:nowTime(),updatedAt:nowTime(),status:'Em andamento',sourceFile:'',importedPdf:''}}
function initial(){let a=blank();a.id='exemplo-1';a.title='Exemplo - Tempo de contribuição';a.client.nome='Segurado de exemplo';a.client.nascimento='1961-10-09';a.client.requerimento='2025-09-07';a.jobs=[{employer:'Tempo 1',cargo:'',start:'1986-02-01',end:'1990-06-12',factor:'1,00'},{employer:'Tempo 2',cargo:'',start:'1990-12-03',end:'1994-06-02',factor:'1,00'},{employer:'Tempo 3',cargo:'',start:'1994-07-01',end:'2019-09-30',factor:'1,00'},{employer:'Tempo futuro',cargo:'',start:'2020-10-01',end:'2025-09-30',factor:'1,00'}];a.modalities=[TYPES[0],TYPES[14]];a.status='Exemplo';
let b=blank();b.id='exemplo-2';b.title='Exemplo - RMI Lei 9.876';b.client.nome='Beneficiário de exemplo';b.modalities=[TYPES[1],TYPES[13]];b.salaries=[{competencia:'04/2010',valor:'3.467,40',origem:'Exemplo'},{competencia:'03/2010',valor:'3.467,40',origem:'Exemplo'},{competencia:'02/2010',valor:'3.467,40',origem:'Exemplo'}];b.status='Exemplo';
return {items:[a,b],activeId:a.id}}
let stored;try{stored=JSON.parse(localStorage.getItem(KEY))}catch(e){}
let data=stored&&Array.isArray(stored.items)?stored:initial();
let ui={route:'dashboard',modal:null,step:0,selectedId:data.activeId||data.items[0]?.id,search:'',font:'Arial',fontSize:12,dock:'table',sort:'recent',salaryPaste:'',previewMode:'',modalView:'',editMode:false,ribbonCollapsed:(()=>{try{return localStorage.getItem('tempo-certo-ribbon-v4')==='collapsed'}catch(e){return false}})()};
let timer;function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Não foi possível salvar no armazenamento local do navegador. Exporte uma cópia JSON.')}}
function autosave(){clearTimeout(timer);timer=setTimeout(()=>{const item=current();if(item){item.updatedAt=nowTime();data.activeId=item.id;}persist();},260)}
function current(){return data.items.find(x=>x.id===ui.selectedId)||data.items[0]||null}
function toast(msg){const n=document.querySelector('#toast');n.textContent=msg;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),4800)}
function iconBtn(action,icon,title='',attrs=''){return `<button type="button" class="icon-btn" data-action="${action}" title="${esc(title)}" aria-label="${esc(title)}" ${attrs}>${ic(icon)}</button>`}
function button(action,label,icon='',cls='',attrs=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${icon?ic(icon):''}${esc(label)}</button>`}
function itemTitle(it){return it?.client?.nome||it?.title||'Cálculo sem identificação'}
function itemMode(it){return it?.modalities?.[it.selected||0]||'Sem modalidade'}
function appTitle(){return `<div class="winbar"><span class="app-icon">TC</span><span>Tempo Certo <span style="color:#828991;font-weight:400">8.2 · Protótipo v8</span>${ui.route==='workspace'&&current()?' — '+esc(current().sourceFile||current().title):''}</span><div class="windows-controls"><span>─</span><span>□</span><span>×</span></div></div>`}
function sideNav(){const links=[['home','Início','dashboard'],['file','Meus cálculos','list'],['plus','Novo cálculo','new'],['calculator','Ferramentas e Extras','tools'],['database','Tabelas e Índices','tables'],['book','Exemplos','examples'],['refresh','Atualização','update'],['help','Ajuda','help'],['settings','Configurações','settings']];return `<aside class="sidebar"><div class="brand"><span class="app-icon">TC</span><div><div class="name">Tempo Certo</div><div class="sub">CÁLCULOS PREVIDENCIÁRIOS</div></div></div><nav class="nav">${links.map(([icon,l,k])=>`<button title="${esc(l)}" class="${ui.route===k?'selected':''}" data-action="${k==='new'?'new':'route'}" ${k==='new'?'':`data-route="${k}"`}>${ic(icon)}<span class="nav-label">${esc(l)}</span></button>`).join('')}</nav><div class="side-bottom">${ic('info')}<br>Protótipo com motor integrado<br>Clique em Calcular no workspace<br>Dados locais neste navegador</div></aside>`}
function dashboardHeader(title='Bem-vindo ao Tempo Certo',sub='Seu programa de cálculos previdenciários'){return `<header class="page-head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><label class="search">${ic('search')}<input type="search" id="globalSearch" placeholder="Buscar cálculo ou modalidade..." value="${esc(ui.search)}" aria-label="Pesquisar cálculos"></label>${iconBtn('notifications','bell','Notificações')}${iconBtn('route-help','help','Ajuda')}</header>`}
function recentRows(list){if(!list.length)return `<tr><td colspan="5" class="empty">Nenhum cálculo encontrado.</td></tr>`;return list.map(it=>`<tr data-action="open-item" data-id="${esc(it.id)}" title="Abrir cálculo"><td>${esc(it.updatedAt?.slice(0,10)||'—')}</td><td><div class="name-line">${esc(itemTitle(it))}</div><div class="desc">${esc(itemMode(it))}</div></td><td>${esc(it.updatedAt||'—')}</td><td><span class="pill ${it.status==='Exemplo'?'warn':'blue'}">${esc(it.status||'Em andamento')}</span></td><td>${iconBtn('item-more','more','Opções',`data-id="${esc(it.id)}"`)}</td></tr>`).join('')}
function filtered(){const q=ui.search.toLowerCase().trim();return data.items.filter(it=>[it.title,itemTitle(it),...(it.modalities||[])].join(' ').toLowerCase().includes(q))}
function dashboard(){const all=filtered();return `${dashboardHeader()}<section class="quick-grid"><button class="quick-action primary" data-action="new"><span class="big-icon">${ic('plus')}</span><span><span class="quick-title">Novo cálculo</span><span class="quick-sub">Iniciar um novo cálculo previdenciário</span></span><span style="margin-left:auto">${ic('arrow')}</span></button><button class="quick-action" data-action="choose-open"><span class="big-icon">${ic('folder')}</span><span><span class="quick-title">Abrir cálculo</span><span class="quick-sub">Arquivo do protótipo</span></span></button><button class="quick-action" data-action="route" data-route="tables"><span class="big-icon">${ic('database')}</span><span><span class="quick-title">Tabelas e índices</span><span class="quick-sub">Consultar ferramentas</span></span></button></section>
<div class="main-grid"><div><div class="metrics"><div class="metric">${ic('file')}<strong>${data.items.length}</strong><span>Cálculos disponíveis</span></div><div class="metric">${ic('clock')}<strong>${data.items.filter(it=>it.status==='Em andamento').length}</strong><span>Em andamento</span></div><div class="metric">${ic('save')}<strong>${data.items.length}</strong><span>Cópias locais automáticas</span></div></div><div class="card" style="margin-top:17px"><div class="card-head">${ic('clock')}<h2>Cálculos recentes</h2><button class="link-button" data-action="route" data-route="list">Ver todos ${ic('arrow')}</button></div><div class="table-scroll"><table class="recent"><thead><tr><th>Data</th><th>Descrição / Tipo de cálculo</th><th>Última alteração</th><th>Situação</th><th></th></tr></thead><tbody>${recentRows(all.slice(0,7))}</tbody></table></div></div></div><div class="aside-col"><div class="card license"><div class="header">${ic('shield')} Licença de demonstração</div><p>O gerenciamento de licenças será integrado posteriormente ao sistema original.</p><div class="details">Versão do protótipo: 0.1<br>Arquivos atuais: JSON do protótipo<br>${button('route-settings','Configurações','settings','small')}</div></div><div class="card updates"><h3>${ic('refresh')} Atualizações</h3><p>${ic('check')} Motor de cálculo conectado (versão inicial).</p><p>${ic('info')} Abra um cálculo e use <strong>Calcular</strong> no workspace.</p>${button('route-tables','Ver ferramentas','database','ghost-orange small')}</div></div></div><section class="bottom-grid"><div class="card small-tile">${ic('play')}<div><h3>Vídeos demonstrativos</h3><p>Área para tutoriais do programa</p></div>${button('route-videos','Ver vídeos','','ghost-orange small')}</div><div class="card small-tile">${ic('book')}<div><h3>Ajuda e exemplos</h3><p>Manual, exemplos e orientações</p></div>${button('route-help','Abrir ajuda','','ghost-orange small')}</div></section><div class="demo-banner"><strong>Motor integrado:</strong> abra um exemplo ou crie um cálculo, preencha o Histórico e clique em <strong>Calcular</strong>. Ainda não abre arquivos .tc8; a paridade fina com o Delphi continua em evolução.</div>`}
function listPage(){return `${dashboardHeader('Meus cálculos','Trabalhos registrados neste navegador')}<div class="section-toolbar">${button('new','Novo cálculo','plus','orange')}${button('choose-open','Importar arquivo do protótipo','upload')}${button('export-json','Exportar cálculo atual','download')}${button('recovery','Recuperação e backup','save')}</div><div class="card"><div class="card-head">${ic('file')}<h2>Arquivos disponíveis (${filtered().length})</h2></div><div class="table-scroll"><table class="recent"><thead><tr><th>Alterado em</th><th>Cálculo</th><th>Última alteração</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${recentRows(filtered())}</tbody></table></div></div><div class="demo-banner">Os trabalhos são armazenados localmente neste navegador. Para levar os dados a outro computador, exporte um arquivo JSON. O formato .tc8 original ainda não está implementado.</div>`}
function utilityPage(){const pages={
tools:['Ferramentas e Extras','Recursos complementares do Tempo Certo'],tables:['Tabelas e índices','Consulta de parâmetros e fontes de cálculo'],examples:['Exemplos de preenchimento','Abra um modelo para explorar o Histórico e a tela de cálculos'],videos:['Vídeos demonstrativos','Área reservada para os tutoriais do programa'],update:['Atualização','Atualize tabelas e software do programa'],help:['Central de ajuda','Orientações e suporte durante o desenvolvimento'],settings:['Configurações','Preferências do protótipo e recursos planejados']};let [title,sub]=pages[ui.route]||pages.help;
let out=dashboardHeader(title,sub);
if(ui.route==='tools')out+=`<h2 class="app-section-title">Modalidades e ferramentas existentes</h2><div class="info-grid">${['Simular salários-de-benefício','Melhor benefício','Apuração do divisor mínimo','Contribuições em atraso','Pensão por morte — acumulação','Conversor de moedas'].map(t=>`<div class="info-block"><h3>${ic('calculator')}${t}</h3><p>Estrutura visual planejada. A função real será conectada às rotinas do programa atual.</p>${button('open-tool','Ver demonstração','arrow','small',`data-name="${esc(t)}"`)}</div>`).join('')}</div>`;
if(ui.route==='tables')out+=`<div class="demo-banner"><strong>Tabelas demonstrativas:</strong> o protótipo não contém índices oficiais. Não utilize esta área para cálculos reais.</div><div class="info-grid"><div class="info-block"><h3>${ic('database')} Tabelas históricas</h3><p>Futuro acesso aos salários mínimos, tetos previdenciários, índices de atualização e parâmetros utilizados pelas modalidades.</p>${button('show-info','Como funcionará','info','small')}</div><div class="info-block"><h3>${ic('sliders')} Índices personalizados</h3><p>Criação, gravação e restauração de configurações específicas, separadas das tabelas oficiais.</p>${button('show-info','Saiba mais','info','small')}</div></div>`;

function workspace(){const it=current();if(!it){ui.route='dashboard';return dashShell()}const toolbar=[['new','Novo','file'],['run-calc','Calcular','calculator'],['choose-mode','Modalidade','plus'],['recovery','A. Backup','database'],['choose-open','Abrir','folder'],['export-json','Salvar','save'],['print','Imprimir','print'],['route-settings','Configurar','settings'],['go-home','Fechar','x']];const subbar=[['route-videos','Vídeos Demonstrativos','play'],['updates','Atualizar Tabelas','refresh'],['updates','Atualizar Software','upload']];return `${appTitle()}<div class="workspace"><div class="classic-menu">${[['go-dashboard','Início'],['new','Novo'],['toggle-text-editor','Editar'],['edit-wizard','Histórico'],['license','Exibir'],['updates','Atualizações'],['about','Sobre'],['route-help','Ajuda'],['route-settings','Configurações'],['route-examples','Exemplos'],['route-tools','Extras']].map(([a,l])=>`<button data-action="${a}" class="${a==='toggle-text-editor'&&ui.editMode?'is-editing':''}">${l}</button>`).join('')}<span class="menu-spacer"></span><button class="ribbon-toggle" type="button" data-action="toggle-ribbon" aria-controls="toolbarRibbon" aria-expanded="${!ui.ribbonCollapsed}" title="${ui.ribbonCollapsed?'Expandir faixa de opções':'Recolher faixa de opções'}">${ui.ribbonCollapsed?'Mostrar faixa de opções':'Ocultar faixa de opções'} <span class="toggle-chevron" aria-hidden="true">${ui.ribbonCollapsed?'⌄':'⌃'}</span></button></div>${ui.ribbonCollapsed?'':`<div id="toolbarRibbon" class="ribbon">${toolbar.map(([a,l,icon])=>`<button data-action="${a}">${ic(icon)}<span>${l}</span></button>`).join('')}<span class="separator"></span>${subbar.map(([a,l,icon])=>`<button data-action="${a}">${ic(icon)}<span>${l}</span></button>`).join('')}</div>`}${ui.editMode?`<div class="editor-toolbar" role="toolbar" aria-label="Formatação do relatório"><select class="font-picker" id="editorFont" aria-label="Fonte do texto"><option value="Arial" ${ui.font==='Arial'?'selected':''}>Aria /div>`:''}<div class="doc-shell"><aside class="doc-list"><h4>Cálculos do trabalho</h4>${(it.modalities||[]).map((m,i)=>`<button class="doc-item ${i===(it.selected||0)?'selected':''}" data-action="select-modality" data-index="${i}">${ic('file')}<span>${esc(m)}</span></button>`).join('')}<button class="doc-item" data-action="choose-mode">${ic('plus')}<span>Adicionar cálculo</span></button></aside><main class="doc-wrapper">${documentPreview(it)}</main></div><div class="result-dock"><div class="dock-title">Resultado do motor: <span style="font-weight:400;color:#8e5d35">${esc(it.calcResults?.[itemMode(it)]?'última execução disponível':'clique em Calcular')}</span></div><div class="dock-buttons">${button('run-calc','Calcular agora','calculator','small orange')}${button('dock-table','Resumo','list','small '+(ui.dock==='table'?'ghost-orange':''))}${button('edit-wizard','Ver Formulário','edit','small')}${button('dock-graph','Ver Gráfico','graph','small '+(ui.dock==='graph'?'ghost-orange':''))}</div>${ui.dock==='graph'?graphDock():tableDock()}</div><div class="statusbar"><span>Arquivo: ${esc(it.sourceFile||it.title)} | ${esc(itemMode(it))}</span><span>${ui.editMode?"Modo de edição do relatório • Salvamento automático":(it.calcResults?.[itemMode(it)]?'Motor integrado • resultado disponível':'Motor integrado • aguardando cálculo')}</span></div></div>`}
function field(label,val){return `<div class="field"><strong>${esc(label)}</strong><span>${esc(val||'')}</span></div>`}
function fmtMoney(n){const v=Number(n);if(!Number.isFinite(v))return String(n??'');return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function documentPreview(it){const c=it.client||{};const type=itemMode(it);const docStyle=it.reportStyles?.[type]||{};const isTempo=/tempo de contribuição/i.test(type);const calc=it.calcResults?.[type];let content='';if(isTempo){const lineByEmp=Object.fromEntries((calc?.lines||[]).map(l=>[l.label,l.value]));const totalTxt=calc?`${calc.totals.anos}a ${calc.totals.meses}m ${calc.totals.dias}d`:'Clique em Calcular';content=`<div class="doc-subheading">DEMONSTRATIVO DE CÁLCULO DE TEMPO DE CONTRIBUIÇÃO</div><div class="wide-table"><table class="doc-grid"><thead><tr><th>Empresa</th><th>Cargo</th><th>Início</th><th>Final</th><th>Fator</th><th>Duplicidade</th><th>Resultado</th></tr></thead><tbody>${it.jobs.map((j,i)=>{const key=j.employer||('Tempo '+(i+1));return `<tr><td>${esc(key)}</td><td>${esc(j.cargo)}</td><td class="center">${fmtDate(j.start)}</td><td class="center">${fmtDate(j.end)}</td><td class="center">${esc(j.factor||'A definir')}</td><td></td><td>${esc(lineByEmp[key]||(calc?'—':'A calcular'))}</td></tr>`}).join('')||'<tr><td colspan="7" style="text-align:center;color:#778">Nenhum vínculo informado no Histórico.</td></tr>'}<tr class="total"><td>TOTAL</td><td></td><td></td><td></td><td></td><td></td><td>${esc(totalTxt)}</td></tr></tbody></table></div><div class="document-note">${calc?`Motor ${esc(calc.engineVersion)} · tabelas ${esc(calc.tablesVersionId)}`:'Use o botão Calcular para apurar o tempo com o motor integrado.'}</div><h3 class="doc-bottom-title">SIMULAÇÃO — EC 103/2019</h3><p style="text-align:center;color:#8f6a46;font-size:11px">Selecione a modalidade EC 103 e calcule para ver o resultado específico.</p>`}
else{const salaryLines=calc?.lines||[];content=`<div style="margin:5px 0 17px"><strong>Espécie de benefício:</strong> ${esc(type)}</div><div class="doc-subheading">SALÁRIOS DE CONTRIBUIÇÃO E ATUALIZAÇÃO MONETÁRIA</div><div class="wide-table"><table class="doc-grid"><thead><tr><th>Nº</th><th>Competência</th><th>Salário de contribuição</th><th>Índice / detalhe</th><th>Valor processado</th><th>Observação</th></tr></thead><tbody>${(it.salaries.length?it.salaries:salaryLines).map((s,i)=>{const line=salaryLines[i];const comp=s.competencia||s.label||line?.label||'';const valor=s.valor??'';const processed=line?fmtMoney(line.value):(calc?'—':'Não calculado');const idx=line?.meta?.index!=null?String(line.meta.index):(calc?'—':'Não integrado');return `<tr><td class="center">${i+1}</td><td class="center">${esc(comp)}</td><td class="center">${esc(valor)}</td><td class="center">${esc(idx)}</td><td class="center">${esc(processed)}</td><td>${esc(s.origem||line?.label||'')}</td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:#778">Nenhum salário informado no Histórico.</td></tr>'}</tbody></table></div><div class="placeholder-panel"><strong>Resultado do cálculo</strong>${calc?`<p>SB: <strong>${esc(fmtMoney(calc.totals.salarioBeneficio??calc.totals.media??'—'))}</strong> · Coeficiente: <strong>${esc(calc.totals.coeficiente??'—')}</strong> · RMI/Benefício: <strong>${esc(fmtMoney(calc.totals.rmi??calc.totals.beneficio??calc.totals.melhorRmi??calc.totals.diferenca??calc.totals.total??'—'))}</strong></p><p style="font-size:12px;color:#667">Motor ${esc(calc.engineVersion)} · tabelas ${esc(calc.tablesVersionId)}</p>`:`<p>Preencha salários/vínculos no Histórico e clique em <strong>Calcular</strong> para obter RMI, diferenças ou benefício EC 103.</p>`}</div>`}
return `<div class="doc-paper ${ui.editMode?'editing':''}" id="printDoc" ${ui.editMode?'contenteditable="true" spellcheck="true" aria-label="Editar texto do demonstrativo"':''} style="font-family:${(docStyle.font||'Arial')==='Georgia'?'Georgia,serif':(docStyle.font||'Arial')==='Calibri'?'Calibri,Arial,sans-serif':(docStyle.font||'Arial')==='Times New Roman'?'Times New Roman,serif':'Arial,sans-serif'};font-size:${docStyle.size||12}px">${it.editedDocs&&it.editedDocs[type]?sanitizeReportHtml(it.editedDocs[type]):`<h2>${esc(isTempo?'CONTAGEM DE TEMPO DE CONTRIBUIÇÃO':type.toUpperCase())}</h2><div class="doc-details">${field('Nome:',c.nome)}${field('Endereço:',c.endereco)}${field('Complemento:',c.complemento)}${field('NIT:',c.nit)}${field('Nº do Benefício:',c.beneficio)}${field('APS:',c.aps)}${field('RG:',c.rg)}${field('CTPS:',c.ctps)}${field('CPF:',c.cpf)}${field('Observações:',c.observacao)}${field('Data de nascimento:',fmtDate(c.nascimento))}${field('Data do requerimento:',fmtDate(c.requerimento))}</div>${content}<p class="document-note" style="border-top:1px solid #c9cdd2;padding-top:10px;margin-top:25px"><strong>AVISO:</strong> motor inicial em evolução — confira sempre com o Tempo Certo Delphi antes de uso jurídico.</p>`}</div>`}
function tableDock(){const it=current();const calc=it?.calcResults?.[itemMode(it)];if(!calc){return `<div class="dock-note" style="padding:12px">Nenhum resultado ainda. Clique em <strong>Calcular</strong>.</div>`}const t=calc.totals;const row=[t.contribuicoes??calc.lines?.length??'—',fmtMoney(t.rmi??t.beneficio??t.melhorRmi??t.diferenca??t.total??t.media??0),t.contribuicoes??'—',t.carencia??'—',t.excluidas??0,t.coeficiente!=null?`${Math.round(Number(t.coeficiente)*1000)/10}%`:'—',fmtMoney(t.salarioBeneficio??t.media??0),t.anos??'—',t.meses??'—',t.dias??'—'];return `<div style="overflow:auto"><table class="dock-table"><thead><tr><th>Número de contribuições</th><th>Valor da renda mensal</th><th>Contribuições consideradas</th><th>Carência</th><th>Contribuições excluídas</th><th>Coeficiente</th><th>Salário de benefício</th><th>Anos</th><th>Meses</th><th>Dias</th></tr></thead><tbody><tr>${row.map((v,i)=>`<td class="${i===1?'hl':''}">${esc(v)}</td>`).join('')}</tr></tbody></table></div><div class="dock-note">Resumo gerado pelo motor integrado (${esc(calc.engineVersion)}).</div>`}

function editorWizard(){const steps=['Dados do cliente','Salários','Vínculos','Cálculos'];let body='';const it=current();if(ui.step===0){body=`<p class="form-intro">Preencha os dados do segurado. Você também pode importar um CNIS para trazer dados pessoais, salários e vínculos de uma só vez.</p><div class="modal-actions" style="margin-bottom:14px">${button('choose-pdf','Importar CNIS em PDF','upload','small orange')}${button('choose-cnis-json','Importar CNIS offline (JSON)','folder','small')}</div><div class="form-grid">${basicInput('nome','Nome completo','half')}${basicInput('mae','Nome da mãe','wide')}${basicInput('nascimento','Data de nascimento','','date')}${basicInput('endereco','Endereço','half')}${basicInput('complemento','Complemento')}${basicInput('nit','NIT / PIS / PASEP')}${basicInput('beneficio','Número do benefício')}${basicInput('aps','APS')}${basicInput('rg','RG')}${basicInput('ctps','CTPS')}${basicInput('cpf','CPF')}${basicInput('requerimento','Data do requerimento','','date')}<div class="input-group wide"><label>Observações</label><textarea data-client="observacao">${esc(it.client.observacao)}</textarea></div></div>`}
if(ui.step===1){body=`<p class="form-intro">Importe um CNIS em PDF para preencher dados pessoais, salários e vínculos. Confira o resumo antes de aplicar.</p><div class="modal-actions">${button('add-salary','Adicionar competência','plus','small orange')}${button('choose-pdf','Importar CNIS em PDF','upload','small')}${button('choose-cnis-json','Importar CNIS offline (JSON)','folder','small')}${button('toggle-paste','Colar dados copiados','copy','small')}${button('clear-salaries','Limpar tabela','trash','small')}</div>${ui.modalView==='paste'?`<div class="drawer-section"><h3>Colar competências e valores</h3><p>Exemplo: <code>01/2025 3.500,00</code>. O parser demonstrativo identifica padrões simples; não substitui um leitor real de CNIS.</p><textarea id="pasteSalary" rows="5" style="width:100%;border:1px solid #cfd5dc;border-radius:6px;padding:10px" placeholder="01/2025 3.500,00&#10;02/2025 3.500,00">${esc(ui.salaryPaste)}</textarea><div class="input-row" style="margin-top:9px">${button('parse-paste','Importar valores identificados','check','small orange')}</div></div>`:''}${it.importedPdf?`<div class="form-hint">PDF selecionado: <strong>${esc(it.importedPdf)}</strong>. Dados extraídos e aguardando conferência ou já importados.</div>`:''}<div class="modal-table"><table class="editable-table"><thead><tr><th>Competência</th><th>Salário de contribuição</th><th>Contribuição paga</th><th>Data do pagamento</th><th>Indicadores</th><th>Origem</th><th style="width:60px"></th></tr></thead><tbody>${it.salaries.map((s,i)=>`<tr><td><input placeholder="MM/AAAA" data-salary="competencia" data-index="${i}" value="${esc(s.competencia)}"></td><td><input placeholder="0,00" data-salary="valor" data-index="${i}" value="${esc(s.valor)}"></td><td><input data-salary="contribuicao" data-index="${i}" value="${esc(s.contribuicao||'')}" placeholder="0,00"></td><td><input data-salary="pagamento" data-index="${i}" value="${esc(s.pagamento||'')}" placeholder="DD/MM/AAAA"></td><td><input data-salary="indicadores" data-index="${i}" value="${esc(s.indicadores||'')}" placeholder="Sem indicador"></td><td><input data-salary="origem" data-index="${i}" value="${esc(s.origem||'Manual')}"></td><td>${iconBtn('remove-salary','trash','Remover',`data-index="${i}"`)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum salário cadastrado. Adicione competências ou cole uma lista.</td></tr>'}</tbody></table></div><div class="form-hint">Os valores são armazenados para conferência e histórico, mas ainda não alimentam um motor previdenciário real. Indicadores e pagamentos devem ser analisados antes de calcular.</div>`}

function cnisExtractRecordIndicators(tail){let m=String(tail||'').match(/\b(?:IREC|PREM|PEND|PSC|EXTEMP|IVIN|PEXT|ACNIS|REC|PREC|IND)[-A-Z0-9,\s]+/i);if(!m)return '';return m[0].replace(/\s+/g,' ').replace(/\b(Compet[eê]ncia|Contribui[cç][aã]o|INSS|P[aá]gina).*$/i,'').trim().replace(/,$/,'')}
function parseCnisPlainText(allText,filename='CNIS.pdf'){
 const t=String(allText||'').replace(/\u00a0/g,' ').replace(/\r/g,'');
 const lines=t.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
 const first=(re)=>{const m=t.match(re);return m?m[1].trim():''};
 const client={nome:first(/\bNome:\s*([^\n]+?)(?=\s+Data de nascimento:|\s+Nome da m[aã]e:|\n|$)/i),nit:first(/\bNIT:\s*([\d.\-]+)/i),cpf:first(/\bCPF:\s*([\d.\-]+)/i),nascimento:cnisIsoDate(first(/Data de nascimento:\s*(\d\d\/\d\d\/\d{4})/i)),mae:first(/Nome da m[aã]e:\s*([^\n]+)/i)};
 if(/CPF:\s*\n/.test(t))client.cpf=first(/CPF:\s*\n\s*([\d.\-]+)/i)||client.cpf;
 const salaries=[],jobs=[],warnings=[],extra=[];
 let seenIds=new Set(),lastPartial=null,orphanIndicators='';
 const contributionRx=/(0[1-9]|1[0-2])\/(19\d{2}|20\d{2})\s+(\d{2}\/\d{2}\/\d{4})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})/g;
 const remunerationRx=/(0[1-9]|1[0-2])\/(19\d{2}|20\d{2})\s+([\d.]+,\d{2})(?=\s|$)/g;
 let inContributions=false,inRemunerations=false;
 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(/^(?:Contribui[cç][oõ]es|Remunera[cç][oõ]es)\b/i.test(line)){inContributions=/Contribui/i.test(line);inRemunerations=!inContributions;continue}
  if(/^(?:Valores Consolidados|Legenda de Indicadores)/i.test(line)){inContributions=false;inRemunerations=false}
  if(/^(?:O INSS poder[aá]|Voc[eê] pode conferir|P[aá]gina \d)/i.test(line))continue;
  const seq=line.match(/^(\d{1,3})\s+([\d.\-]{10,})\s+(.+?)\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})(?:\s+([A-Z][-A-Z0-9, ]+))?$/);
  if(seq&&/^(?:\d{2}\/\d{2}\/\d{4})$/.test(seq[4])){
   const before=seq[3].trim();const types=['Contribuinte Individual','Empregado ou Agente Público','Empregado','Contribuinte Facultativo','Facultativo','Trabalhador Avulso','Segurado Especial','Doméstico'];
   const typ=types.find(x=>before.toLowerCase().endsWith(x.toLowerCase()))||'';
   const name=typ?before.slice(0,-typ.length).trim():before;
   const job={employer:name||'Vínculo CNIS',cargo:typ,start:cnisIsoDate(seq[4]),end:cnisIsoDate(seq[5]),factor:'',indicadores:(seq[6]||'').trim(),nit:seq[2],origem:'CNIS',seq:seq[1]};
   const key=job.seq+'|'+job.start+'|'+job.end;if(!seenIds.has('job-'+key)){jobs.push(job);seenIds.add('job-'+key)}
   continue;
  }
  if(inContributions){
   const arr=[...line.matchAll(new RegExp(contributionRx.source,'g'))];
   if(arr.length){
    for(let k=0;k<arr.length;k++){
     const m=arr[k],tail=line.slice(m.index+m[0].length, k+1<arr.length?arr[k+1].index:line.length);
     const comp=m[1]+'/'+m[2]; const value=m[5];

     if(seenIds.has(id))continue;seenIds.add(id);
     const indicators=cnisExtractRecordIndicators(tail)||orphanIndicators;
     const row={competencia:comp,valor:value,pagamento:m[3],contribuicao:m[4],indicadores:indicators,origem:'CNIS',vinculo:jobs.length?jobs[jobs.length-1].seq:''};
     if(orphanIndicators)orphanIndicators='';

    }

   }
   if(lastPartial&&/^(?:LC\d+|MEI|IREC-|,)/i.test(line)){
    lastPartial.indicadores=(lastPartial.indicadores+line).replace(/\s+/g,' ');lastPartial=null;continue;
   }
   if(/^(?:IREC|PREM|PEND)[-A-Z0-9,\s]+$/i.test(line)&&!/^IREC-[A-Z]+(?:,\s*IREC-[A-Z]+)*$/.test('')){orphanIndicators=line;continue}
  }
  if(inRemunerations&&/^\d{2}\/\d{4}\s/.test(line)){
   const matches=[...line.matchAll(new RegExp(remunerationRx.source,'g'))];
   for(let k=0;k<matches.length;k++){
    const m=matches[k],comp=m[1]+'/'+m[2],value=m[3],tail=line.slice(m.index+m[0].length,k+1<matches.length?matches[k+1].index:line.length);
    const id=comp+'|'+value+'|'+i;
    if(seenIds.has(id))continue;seenIds.add(id);
    salaries.push({competencia:comp,valor:value,pagamento:'',contribuicao:'',indicadores:cnisExtractRecordIndicators(tail),origem:'CNIS',vinculo:jobs.length?jobs[jobs.length-1].seq:''});
   }
  }
 }
 // Fallback: Alguns extratos contêm as contribuições em tabelas sem a legenda seccionada na extração.
 if(!salaries.length){
   for(const l of lines){let arr=[...l.matchAll(new RegExp(contributionRx.source,'g'))];for(let k=0;k<arr.length;k++){
     let m=arr[k],key=m[1]+'/'+m[2]+'|'+m[3];if(seenIds.has(key))continue;seenIds.add(key);
     const tail=l.slice(m.index+m[0].length,k+1<arr.length?arr[k+1].index:l.length);
     salaries.push({competencia:m[1]+'/'+m[2],pagamento:m[3],contribuicao:m[4],valor:m[5],indicadores:cnisExtractRecordIndicators(tail),origem:'CNIS',vinculo:''});
   }}
 }
 salaries.sort((a,b)=>{const [ma,ya]=a.competencia.split('/').map(Number),[mb,yb]=b.competencia.split('/').map(Number);return (ya-yb)||ma-mb});
 if(!client.nome&&!client.cpf)warnings.push('Não foi possível identificar com segurança o titular do documento.');
 if(!salaries.length)warnings.push('Nenhum salário de contribuição reconhecido. Confira o PDF.');
 if(!jobs.length)warnings.push('Nenhum vínculo identificado automaticamente. Confira a etapa Vínculos.');
 const codes=[...new Set((t.match(/\b(?:IREC|PREM|PEND|PSC|IVIN|PEXT|PREC|ACNIS)[-A-Z0-9]+\b/g)||[]))].sort();
 if(codes.length)warnings.push('Há indicadores/pendências no CNIS: '+codes.join(', ')+'. Eles serão preservados; não representam validação automática de tempo ou salário.');
 const consolidados=/Valores Consolidados por Ano Civil/i.test(t);
 if(consolidados)warnings.push('O quadro “Valores Consolidados por Ano Civil” foi identificado e não foi confundido com salários de contribuição.');
 if(!client.nascimento)warnings.push('Data de nascimento não encontrada; confira o cadastro.');
 return {format:'tempo-certo-importacao-cnis',version:1,filename,client,salaries,jobs,warnings,documentDate:first(/Extrato Previdenci[aá]rio\s+(\d{2}\/\d{2}\/\d{4})/i),indicatorCodes:codes,consolidadosPresent:consolidados,pageCount:0,extracted:true};
}
function cnisPdfLines(items,viewport,pdfjs){
 const tokens=items.filter(o=>o.str&&o.str.trim()).map(it=>{
  const xy=pdfjs.Util.transform(viewport.transform,it.transform);
  return {x:xy[4],y:xy[5],str:it.str.trim()};
 }).sort((a,b)=>a.y-b.y||a.x-b.x);
 const rows=[];
 for(const token of tokens){
  let last=rows[rows.length-1];
  if(!last||Math.abs(last.y-token.y)>3.2){last={y:token.y,parts:[]};rows.push(last)}
  last.parts.push(token);
 }
 return rows.map(r=>r.parts.sort((a,b)=>a.x-b.x).map(o=>o.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
}
function cnisJsonToPending(obj,filename){if(obj.format!=='tempo-certo-importacao-cnis'||!Array.isArray(obj.salaries)||!Array.isArray(obj.jobs)||!obj.client)throw Error('JSON CNIS incompatível.');cnisPending={...obj,filename:filename||obj.filename||'CNIS'};ui.modal='cnis-preview';render()}
async function cnisImportPdf(file){
 toast('Lendo PDF e preparando conferência...');
 const pdfjs=await cnisLoadPdfjs();
 const document=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
 const pages=[];
 for(let i=1;i<=document.numPages;i++){
  const page=await document.getPage(i),tc=await page.getTextContent(),v=page.getViewport({scale:1});
  pages.push(...cnisPdfLines(tc.items,v,pdfjs));
 }
 const result=parseCnisPlainText(pages.join('\n'),file.name);
 result.pageCount=document.numPages;
 if(!result.salaries.length&&!result.jobs.length)throw Error('Não foi possível ler as tabelas. Este PDF pode ser digitalizado, não textual, ou possuir um layout ainda não suportado.');
 cnisPending=result;ui.modal='cnis-preview';render();
}
let cnisScriptPromise=null;
function cnisLoadPdfjs(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(cnisScriptPromise)return cnisScriptPromise;
 cnisScriptPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  script.referrerPolicy='no-referrer';
  script.onload=()=>{if(!window.pdfjsLib){reject(Error('Biblioteca PDF indisponível.'));return}window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(window.pdfjsLib)};
  script.onerror=()=>reject(Error('Não foi possível carregar o leitor de PDF. É necessário acesso à internet nesta versão de demonstração. Use a alternativa de importação JSON offline.'));
  document.head.append(script);
 }).catch(err=>{cnisScriptPromise=null;throw err});
 return cnisScriptPromise;
}

function cnisApply(mode){

 if(mode==='replace'){
  it.salaries=p.salaries.map(s=>({...s}));it.jobs=p.jobs.map(j=>({...j}));
  for(const [key,value] of Object.entries(p.client))if(value)it.client[key]=value;
 }else{
  for(const [key,value] of Object.entries(p.client))if(value&&!it.client[key])it.client[key]=value;
  const seenSal=new Set(it.salaries.map(s=>[s.competencia,s.valor,s.pagamento||'',s.contribuicao||''].join('|')));
  for(const s of p.salaries){const key=[s.competencia,s.valor,s.pagamento||'',s.contribuicao||''].join('|');if(!seenSal.has(key)){it.salaries.push({...s});seenSal.add(key)}}
  const seenJobs=new Set(it.jobs.map(j=>[j.employer,j.start,j.end].join('|')));
  for(const j of p.jobs){const key=[j.employer,j.start,j.end].join('|');if(!seenJobs.has(key)){it.jobs.push({...j});seenJobs.add(key)}}
 }
 it.importedPdf=p.filename;it.cnisInfo={filename:p.filename,documentDate:p.documentDate,indicatorCodes:p.indicatorCodes||[],consolidadosPresent:!!p.consolidadosPresent,importedAt:new Date().toISOString(),pageCount:p.pageCount};

}

// A formatação editada é armazenada por modalidade, separada dos dados originais do Histórico.
function sanitizeReportHtml(html){
 const template=document.createElement('template');template.innerHTML=String(html||'');
 const allowed=new Set(['DIV','P','SPAN','STRONG','B','EM','I','U','S','H1','H2','H3','H4','BR','UL','OL','LI','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','FONT','BLOCKQUOTE']);
 const styles=new Set(['font-family','font-size','font-weight','font-style','text-decoration','text-align','color','background-color','background','border','border-top','border-bottom','border-left','border-right','border-radius','padding','padding-top','padding-bottom','padding-left','padding-right','margin','margin-top','margin-bottom','margin-left','margin-right','min-height','width','max-width','display','grid-template-columns','column-gap','gap','overflow-wrap']);
 for(const el of Array.from(template.content.querySelectorAll('*')).reverse()){
  if(!allowed.has(el.tagName)){
   if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','IMG','LINK','META','FORM','INPUT','VIDEO','AUDIO'].includes(el.tagName))el.remove();
   else el.replaceWith(...Array.from(el.childNodes));
   continue;
  }
  for(const attr of Array.from(el.attributes)){
   const name=attr.name.toLowerCase();
   if(name==='class'){
    el.setAttribute('class',el.className.replace(/[^a-zA-Z0-9_ -]/g,''));
   }else if(name==='style'){
    const current=el.style;
    for(const name of Array.from(current).filter(p=>!styles.has(p)||/url\s*\(|expression\s*\(/i.test(current.getPropertyValue(p))))current.removeProperty(name);
    el.setAttribute('style',current.cssText);
   }else if(!['colspan','rowspan','size','face'].includes(name))el.removeAttribute(attr.name);
  }
 }
 return template.innerHTML;
}

let lastEditorRange=null;

let editorHistory=null;
function saveEditorSelection(){if(!ui.editMode)return;const s=window.getSelection();const doc=document.querySelector('#printDoc');if(s&&s.rangeCount&&doc&&doc.contains(s.anchorNode)&&doc.contains(s.focusNode))lastEditorRange=s.getRangeAt(0).cloneRange()}

// Guarda o texto e as opções de apresentação a cada edição, permitindo voltar e refazer.
function reportHistoryKey(){const it=current();return it?it.id+'::'+itemMode(it):''}
function reportSnapshot(){
 const it=current(),doc=document.querySelector('#printDoc');if(!it||!doc||!ui.editMode)return null;
 const mode=itemMode(it),styles=it.reportStyles?.[mode];
 const edited=Boolean(it.editedDocs&&Object.prototype.hasOwnProperty.call(it.editedDocs,mode));
 return {edited,html:sanitizeReportHtml(doc.innerHTML),style:styles?{...styles}:null,font:ui.font,size:ui.fontSize};
}
function startReportHistory(){const snapshot=reportSnapshot();editorHistory=snapshot?{key:reportHistoryKey(),states:[snapshot],index:0}:null;updateEditorHistoryButtons()}
function canUndoReport(){return !!editorHistory&&editorHistory.key===reportHistoryKey()&&editorHistory.index>0}
function canRedoReport(){return !!editorHistory&&editorHistory.key===reportHistoryKey()&&editorHistory.index<editorHistory.states.length-1}
function updateEditorHistoryButtons(){
 const undo=document.querySelector('#undoEditBtn'),redo=document.querySelector('#redoEditBtn');
 if(undo)undo.disabled=!canUndoReport();if(redo)redo.disabled=!canRedoReport();
}
function recordReportHistory(){
 if(!editorHistory||editorHistory.key!==reportHistoryKey())return;
 const snap=reportSnapshot();if(!snap)return;
 const last=editorHistory.states[editorHistory.index];
 if(last&&JSON.stringify(last)===JSON.stringify(snap)){updateEditorHistoryButtons();return}
 editorHistory.states=editorHistory.states.slice(0,editorHistory.index+1);
 editorHistory.states.push(snap);
 if(editorHistory.states.length>100)editorHistory.states.shift();
 editorHistory.index=editorHistory.states.length-1;updateEditorHistoryButtons();
}
function moveReportHistory(delta){
 if(!editorHistory||editorHistory.key!==reportHistoryKey())return;
 const next=editorHistory.index+delta;if(next<0||next>=editorHistory.states.length)return;
 editorHistory.index=next;
 const snap=editorHistory.states[next],it=current(),mode=itemMode(it);
 it.editedDocs=it.editedDocs||{};
 if(snap.edited)it.editedDocs[mode]=snap.html;else delete it.editedDocs[mode];
 it.reportStyles=it.reportStyles||{};
 if(snap.style)it.reportStyles[mode]={...snap.style};else delete it.reportStyles[mode];
 ui.font=snap.font;ui.fontSize=snap.size;lastEditorRange=null;
 autosave();render();updateEditorHistoryButtons();
 const doc=document.querySelector('#printDoc');doc?.focus();
 toast(delta<0?'Última alteração desfeita.':'Alteração refeita.');
}
function restoreOriginalReport(){
 const it=current();if(!it)return;
 if(!confirm('Restaurar o texto e a formatação originais deste cálculo? As alterações personalizadas serão substituídas. Você poderá usar Desfazer enquanto continuar nesta edição.'))return;
 const mode=itemMode(it);
 if(it.editedDocs)delete it.editedDocs[mode];
 if(it.reportStyles)delete it.reportStyles[mode];
 ui.font='Arial';ui.fontSize=12;lastEditorRange=null;
 autosave();render();recordReportHistory();
 toast('Demonstrativo original restaurado. Use Desfazer para recuperar a versão anterior.');
}
function render(){document.querySelector('#app').innerHTML=(ui.route==='workspace'?workspace():dashShell())+(ui.modal?(ui.modal==='wizard'?editorWizard():ui.modal==='cnis-preview'?cnisReviewModal():simpleModal()):'');const search=document.querySelector('#globalSearch');if(search&&ui.search&&!search.value)search.value=ui.search}
function choose(it){ui.selectedId=it.id;data.activeId=it.id;ui.route='workspace';ui.modal=null;ui.dock='table';ui.editMode=false;editorHistory=null;lastEditorRange=null;const df=it.reportStyles?.[itemMode(it)];ui.font=df?.font||'Arial';ui.fontSize=df?.size||12;persist();render()}
function create(){const b=blank();data.items.unshift(b);choose(b);ui.step=0;ui.modal='wizard';render()}
function download(filename,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){if(ui.editMode)saveReportText();const it=current();if(!it){toast('Abra um cálculo antes de exportar.');return}download((it.client.nome||it.title||'calculo').replace(/[^a-z0-9_-]/gi,'_')+'.json',JSON.stringify({format:'tempo-certo-prototipo',version:1,calculation:it},null,2),'application/json;charset=utf-8');toast('Arquivo JSON do protótipo exportado. Não é um arquivo .tc8.')}
function enterRoute(route){if(ui.editMode)saveReportText();ui.route=route;ui.modal=null;ui.editMode=false;editorHistory=null;lastEditorRange=null;render()}
function toggleStep(step){ui.step=Math.max(0,Math.min(3,step));render()}
function finish(){const it=current();if(!it.modalities.length){toast('Selecione pelo menos uma modalidade.');return}it.title=it.client.nome?'Cálculo - '+it.client.nome:it.title;it.updatedAt=nowTime();autosave();ui.modal=null;ui.route='workspace';render();toast('Histórico salvo. Clique em Calcular para executar o motor.');runCalculation()}
function runCalculation(){const it=current();if(!it){toast('Abra um cálculo antes.');return}if(!window.__tcEngine?.ready){toast('Motor ainda carregando… tente de novo em 1 segundo.');return}const type=itemMode(it);try{const result=window.__tcEngine.calculateItem(it,type);it.calcResults=it.calcResults||{};it.calcResults[type]=result;it.updatedAt=nowTime();if(it.editedDocs)delete it.editedDocs[type];autosave();render();toast(`Cálculo concluído: ${type}`)}catch(err){toast(String(err.message||err))}}
function handleAction(el){const act=el.dataset.action;const it=current();switch(act){
case 'toggle-text-editor':
 if(ui.editMode){saveReportText();ui.editMode=false;editorHistory=null;lastEditorRange=null;render();toast('Texto formatado e salvo junto ao trabalho.')}else{ui.editMode=true;render();startReportHistory();toast('Modo de edição ativado. Selecione um trecho do demonstrativo e use as ferramentas de formatação.');}
 break;
case 'finish-editor':saveReportText();ui.editMode=false;editorHistory=null;lastEditorRange=null;render();toast('Edição concluída e salva.');break;
case 'undo-report':moveReportHistory(-1);break;
 case 'redo-report':moveReportHistory(1);break;
 case 'reset-report':restoreOriginalReport();break;
case 'text-bold':case 'text-italic':case 'text-underline':case 'text-left':case 'text-center':case 'text-right':applyRichFormat(act);break;
case 'new':create();break;
case 'route':enterRoute(el.dataset.route);break;
case 'go-home':enterRoute('dashboard');break;
case 'go-dashboard':enterRoute('dashboard');break;
case 'toggle-ribbon':{
 ui.ribbonCollapsed=!ui.ribbonCollapsed;
 try{localStorage.setItem('tempo-certo-ribbon-v4',ui.ribbonCollapsed?'collapsed':'expanded')}catch(e){}
 render();
 break;
}
case 'route-help':enterRoute('help');break;
case 'route-examples':enterRoute('examples');break;
case 'route-tools':enterRoute('tools');break;
case 'route-tables':enterRoute('tables');break;
case 'route-videos':enterRoute('videos');break;
case 'route-settings':enterRoute('settings');break;
case 'route-update':enterRoute('update');break;
case 'open-item':{const target=data.items.find(x=>x.id===el.dataset.id);if(target)choose(target);break}
case 'choose-open':document.querySelector('#fileOpen').click();break;
case 'choose-pdf':document.querySelector('#pdfOpen').click();break;
 case 'choose-cnis-json':document.querySelector('#cnisJsonOpen').click();break;
 case 'cancel-cnis':cnisPending=null;ui.modal='wizard';render();break;
 case 'cnis-append':cnisApply('append');break;
 case 'cnis-replace':cnisApply('replace');break;
case 'export-json':exportJSON();break;
case 'edit-wizard':if(it){ui.modal='wizard';ui.step=0;ui.modalView='';render()}break;
case 'wizard-step':toggleStep(Number(el.dataset.index));break;
case 'wizard-prev':toggleStep(ui.step-1);break;
case 'wizard-next':toggleStep(ui.step+1);break;
case 'wizard-finish':finish();break;
case 'close-modal':ui.modal=null;render();break;
case 'add-salary':it.salaries.push({competencia:'',valor:'',origem:'Manual'});autosave();render();break;
case 'remove-salary':it.salaries.splice(Number(el.dataset.index),1);autosave();render();break;
case 'clear-salaries':if(confirm('Deseja remover todos os salários deste cálculo?')){it.salaries=[];autosave();render()}break;
case 'toggle-paste':ui.modalView=ui.modalView==='paste'?'':'paste';render();break;
case 'parse-paste':{const ta=document.querySelector('#pasteSalary');const raw=ta?.value||'';const rg=/(0[1-9]|1[0-2])\/(19\d{2}|20\d{2})\s+(?:R\$\s*)?([\d.]+,\d{2})/g;let match,n=0;while((match=rg.exec(raw))!==null){it.salaries.push({competencia:match[1]+'/'+match[2],valor:match[3],origem:'Texto colado'});n++}ui.salaryPaste=raw;autosave();render();toast(n?`${n} competências identificadas. Confira todos os dados.`:'Nenhum par competência/salário foi identificado. Use MM/AAAA 1.234,56.');break}
case 'add-job':it[el.dataset.list].push({employer:'',cargo:'',start:'',end:'',factor:'1,00'});autosave();render();break;
case 'remove-job':it[el.dataset.list].splice(Number(el.dataset.index),1);autosave();render();break;
case 'select-modality':if(ui.editMode)saveReportText();it.selected=Number(el.dataset.index);{const df=it.reportStyles?.[itemMode(it)];ui.font=df?.font||'Arial';ui.fontSize=df?.size||12;}lastEditorRange=null;editorHistory=null;ui.editMode=false;autosave();render();break;
case 'run-calc':runCalculation();break;
case 'choose-mode':ui.modal='choose-mode';render();break;
case 'add-modality':{const ty=TYPES[Number(el.dataset.index)];if(!it.modalities.includes(ty))it.modalities.push(ty);it.selected=it.modalities.indexOf(ty);autosave();ui.modal=null;render();runCalculation();break}
case 'recovery':ui.modal='recovery';render();break;
case 'dock-table':ui.dock='table';render();break;
case 'dock-graph':ui.dock='graph';render();break;
case 'item-more':ui.modal='item-more';ui.previewMode=el.dataset.id;render();break;
case 'duplicate-item':{const other=data.items.find(x=>x.id===el.dataset.id);if(other){const b=JSON.parse(JSON.stringify(other));b.id=makeId();b.title=other.title+' - cópia';b.status='Em andamento';b.updatedAt=nowTime();data.items.unshift(b);autosave();choose(b);toast('Cálculo duplicado.')}break}
case 'delete-item':{if(confirm('Excluir este trabalho do armazenamento local?')){data.items=data.items.filter(x=>x.id!==el.dataset.id);ui.modal=null;if(ui.selectedId===el.dataset.id)ui.selectedId=data.items[0]?.id;persist();render();toast('Trabalho excluído.')}break}
case 'print':if(ui.route==='workspace'){window.print()}else{toast('Abra um cálculo para imprimir o demonstrativo.')}break;
case 'updates':toast('Protótipo: atualização de software e tabelas ainda não conectada.');break;
case 'updates-tables':toast('Protótipo: a atualização de tabelas ainda não está conectada.');break;
case 'updates-software':toast('Protótipo: a atualização de software ainda não está conectada.');break;
case 'notifications':toast('Nenhuma notificação. Esta função será conectada na versão final.');break;
case 'license':toast('Licenciamento demonstrativo. A ativação real será integrada posteriormente.');break;
case 'about':ui.modal='about';render();break;
case 'show-info':ui.modal='info';render();break;
case 'open-tool':toast(`${el.dataset.name}: a interface de execução será integrada ao programa original.`);break;
default:break;
}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target||target.disabled)return;handleAction(target)});
document.addEventListener('input',e=>{const t=e.target;const it=current();if(!it)return;
if(t.dataset.client){it.client[t.dataset.client]=t.value;autosave()}
if(t.dataset.salary&&it.salaries[Number(t.dataset.index)]){it.salaries[Number(t.dataset.index)][t.dataset.salary]=t.value;autosave()}
if(t.dataset.job&&it[t.dataset.list]?.[Number(t.dataset.index)]){it[t.dataset.list][Number(t.dataset.index)][t.dataset.job]=t.value;autosave()}
if(t.id==='printDoc'&&ui.editMode){saveReportText()}
if(t.id==='pasteSalary'){ui.salaryPaste=t.value}
if(t.id==='globalSearch'){ui.search=t.value;const body=document.querySelector('table.recent tbody');if(body)body.innerHTML=recentRows(filtered().slice(0,ui.route==='dashboard'?7:999))}
});
document.addEventListener('change',e=>{const t=e.target;const it=current();if(t.dataset.type&&it){const ty=TYPES[Number(t.dataset.type)];if(t.checked&&!it.modalities.includes(ty))it.modalities.push(ty);if(!t.checked)it.modalities=it.modalities.filter(v=>v!==ty);it.selected=Math.min(it.selected||0,Math.max(0,it.modalities.length-1));autosave()}
if(t.id==='editorFont'){formatTextSelection('fontName',t.value)}
if(t.id==='editorSize'){formatTextSelection('fontSize',t.value)}
});
document.addEventListener('selectionchange',saveEditorSelection);
document.addEventListener('keydown',e=>{if(ui.editMode&&(e.ctrlKey||e.metaKey)&&['z','y'].includes(e.key.toLowerCase())){const k=e.key.toLowerCase();if(document.activeElement?.id==='printDoc'||document.activeElement?.closest('.editor-toolbar')){e.preventDefault();moveReportHistory((k==='y'||e.shiftKey)?1:-1);return}}if(e.ctrlKey&&e.key==='F1'&&ui.route==='workspace'){e.preventDefault();handleAction({dataset:{action:'toggle-ribbon'}})}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportJSON()}if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
document.querySelector('#fileOpen').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.name.toLowerCase().endsWith('.tc8')){toast('O arquivo .tc8 exige a integração com o leitor do Tempo Certo original. Não é possível abri-lo neste protótipo.');return}try{const obj=JSON.parse(await file.text());if(obj.format!=='tempo-certo-prototipo'||!obj.calculation||!obj.calculation.client||!Array.isArray(obj.calculation.modalities))throw Error('Formato não reconhecido');const it=obj.calculation;it.id=makeId();it.sourceFile=file.name;it.status='Em andamento';it.updatedAt=nowTime();it.jobs=Array.isArray(it.jobs)?it.jobs:[];it.extraJobs=Array.isArray(it.extraJobs)?it.extraJobs:[];it.salaries=Array.isArray(it.salaries)?it.salaries:[];data.items.unshift(it);choose(it);toast('Arquivo do protótipo importado. Verifique os dados.')}catch(ex){toast('Não foi possível abrir o arquivo. Este protótipo importa apenas JSON exportado por ele mesmo.')}});
document.querySelector('#pdfOpen').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{await cnisImportPdf(file)}catch(err){toast('Falha ao ler CNIS: '+err.message)}});
 document.querySelector('#cnisJsonOpen').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{cnisJsonToPending(JSON.parse(await file.text()),file.name)}catch(err){toast('Importação JSON não reconhecida: '+err.message)}});
render();
})();

</script>
